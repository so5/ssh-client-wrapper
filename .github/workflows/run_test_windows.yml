name: research linux remote (WSL2 docker) for the windows client
# Research only. Pattern taken from RIKEN-RCCS/OPEN-WHEEL run_test_windows.yml (Vampire/setup-wsl + docker-ce in WSL).
on:
  workflow_dispatch:
  push:
    branches:
      - research/win-linux-container
    paths:
      - .github/workflows/run_test_windows.yml
jobs:
  wsl-remote:
    strategy:
      fail-fast: false
      matrix:
        variant: [pty, pty-sshadd, spawn]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEST_HOST: localhost
      TEST_USER: testuser
      TEST_PW: passw0rd
      TEST_PORT: 10022
      TEST_HOST2: testbed2
      TEST_HOST2_VERIFY: localhost
      TEST_USER2: testuser
      TEST_PORT2: 22
      TEST_PORT2_VERIFY: 10023
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Setup WSL with Ubuntu
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-22.04
          additional-packages: apt-transport-https ca-certificates curl gnupg lsb-release
      - name: Install Docker Engine in WSL
        shell: wsl-bash {0}
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          sudo service docker start
          timeout 60 bash -c 'until sudo docker info >/dev/null 2>&1; do sleep 2; done'
          sudo docker version --format '{{.Server.Version}}'
      - name: Start the test sshd containers in WSL
        shell: wsl-bash {0}
        run: |
          sudo docker network create testnet
          sudo docker run -d --name testbed --network testnet --network-alias testbed -p 10022:22 naoso5/test-sshd
          sudo docker run -d --name testbed2 --network testnet --network-alias testbed2 -p 10023:22 naoso5/test-sshd
          sleep 5
          sudo docker ps
      - name: Keys on the Windows side
        shell: pwsh
        run: |
          $ssh = "$env:USERPROFILE\.ssh"; New-Item -ItemType Directory -Force $ssh | Out-Null
          & 'C:\Windows\System32\OpenSSH\ssh-keygen.exe' -q -t rsa -b 2048 -N '' -f "$ssh\id_rsa" -C plain
          "TEST_KEYFILE=$ssh\id_rsa" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PUBKEY_WIN=$ssh\id_rsa.pub" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install the key to the containers (from WSL)
        shell: wsl-bash {0}
        run: |
          pub="/mnt/c/Users/runneradmin/.ssh/id_rsa.pub"
          ls -l "$pub"
          for c in testbed testbed2; do
            sudo docker exec -i $c bash -c "mkdir -p /home/testuser/.ssh && cat >> /home/testuser/.ssh/authorized_keys && chown -R testuser:testuser /home/testuser/.ssh && chmod 700 /home/testuser/.ssh && chmod 600 /home/testuser/.ssh/authorized_keys" < "$pub"
          done
      - name: Check the connection from Windows
        shell: pwsh
        run: |
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i "$env:TEST_KEYFILE" -p 10022 testuser@localhost "uname -a; which rsync"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i "$env:TEST_KEYFILE" -p 10023 testuser@localhost "uname -a"
      - name: Install MSYS2 rsync and openssh (client side)
        shell: pwsh
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm rsync openssh 2>&1 | Select-Object -Last 3
      - run: npm ci
      - name: Integration tests (Windows client, Linux remote in WSL2 docker)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = $env:PATH + ";C:\msys64\usr\bin"
          Get-Command ssh, rsync | Format-Table Name, Source
          $mon = "$env:RUNNER_TEMP\procs.txt"
          Start-Job -ArgumentList $mon -ScriptBlock {
            param($f)
            while ($true) {
              $t = (Get-Date).ToString("HH:mm:ss.fff")
              Get-CimInstance Win32_Process -Filter "Name='ssh.exe' or Name='rsync.exe' or Name='conhost.exe' or Name='OpenConsole.exe'" | ForEach-Object {
                $cmd = "$($_.CommandLine)"
                if ($cmd.Length -gt 90) { $cmd = $cmd.Substring(0, 90) }
                "$t $($_.Name) pid=$($_.ProcessId) ppid=$($_.ParentProcessId) threads=$($_.ThreadCount) $cmd" | Out-File -Append -Encoding utf8 $f
              }
              "$t ---" | Out-File -Append -Encoding utf8 $f
              Start-Sleep -Seconds 2
            }
          } | Out-Null
          $env:REPRO_MODE = "${{ matrix.variant }}"
          node research/repro.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\integration.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-remote-log-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/integration.txt
            ${{ runner.temp }}/procs.txt
          retention-days: 7
