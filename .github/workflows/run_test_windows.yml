name: research linux containers on windows runner
on:
  workflow_dispatch:
  push:
    branches:
      - research/win-linux-container
    paths:
      - .github/workflows/run_test_windows.yml
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Facts
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ComputerInfo | Select-Object OsName,OsVersion,HyperVisorPresent,HyperVRequirementVirtualizationFirmwareEnabled,HyperVRequirementSecondLevelAddressTranslation | Format-List
          Get-Service docker -ErrorAction SilentlyContinue | Format-List Name,Status
          docker version 2>&1
          docker info --format 'OSType={{.OSType}} Isolation={{.Isolation}} Server={{.ServerVersion}}' 2>&1
          docker context ls 2>&1
          Get-ChildItem "C:\Program Files\Docker" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          wsl --status 2>&1
          wsl --list --online 2>&1 | Select-Object -First 12
          Get-WindowsOptionalFeature -Online | Where-Object { $_.FeatureName -match 'Hyper-V$|VirtualMachinePlatform|Microsoft-Windows-Subsystem-Linux|Containers$' } | Format-Table FeatureName,State
      - name: Try the Linux engine
        shell: pwsh
        continue-on-error: true
        run: |
          $cli = "C:\Program Files\Docker\Docker\DockerCli.exe"
          if (Test-Path $cli) { & $cli -SwitchLinuxEngine 2>&1; Start-Sleep 20 }
          docker info --format 'OSType={{.OSType}}' 2>&1
      - name: Try to run the Linux test sshd
        shell: pwsh
        continue-on-error: true
        run: |
          docker run -d --name t -p 10022:22 naoso5/test-sshd 2>&1
          Start-Sleep 10
          docker ps -a 2>&1
          docker logs t 2>&1 | Select-Object -Last 10
          Test-NetConnection localhost -Port 10022 | Format-List TcpTestSucceeded
      - name: Try WSL2 (Ubuntu)
        shell: pwsh
        continue-on-error: true
        run: |
          wsl --install -d Ubuntu --no-launch 2>&1 | Select-Object -Last 8
          wsl -l -v 2>&1
          wsl -d Ubuntu -- uname -a 2>&1
