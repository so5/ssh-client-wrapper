name: research scw on windows

# Research only (branch research/scw-windows): does ssh-client-wrapper (microsoft/node-pty, useControlMaster off by default on win32) work on a Windows runner?
# Not part of the pull request checks. Run it by hand (workflow_dispatch) or by pushing to this branch.
on:
  workflow_dispatch:
  push:
    branches:
      - research/scw-windows
env:
  GOKRAZY_VERSION: v0.3.10
  GH_TOKEN: ${{ github.token }}
jobs:
  windows:
    name: windows (sshd of the runner as the remote, ssh = ${{ matrix.ssh }})
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ssh: [win32-openssh, git-ssh]
    env:
      TEST_HOST: localhost
      TEST_HOST2: localhost
      TEST_PORT: 22
      TEST_PORT2: 22
      TEST_PORT2_VERIFY: 22
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Released gokr-rsync, with a rsync.cmd in front of it
        run: |
          mkdir -p "$RUNNER_TEMP/gz" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/gz"
          gh release download "$GOKRAZY_VERSION" --repo gokrazy/rsync -p rsync_Windows_x86_64.zip
          want=$(gh api "repos/gokrazy/rsync/releases/tags/$GOKRAZY_VERSION" -q '.assets[]|select(.name=="rsync_Windows_x86_64.zip").digest')
          echo "${want#sha256:}  rsync_Windows_x86_64.zip" | sha256sum -c -
          unzip -o rsync_Windows_x86_64.zip
          cp gokr-rsync.exe "$RUNNER_TEMP/bin/"
          # research only: the version line which scw parses, and no --copy-unsafe-links (gokrazy/rsync#45)
          cat > "$RUNNER_TEMP/bin/rsync.cmd" <<'CMD'
          @echo off
          if "%~1"=="--version" (
            echo rsync  version 0.3.10  ^(gokrazy/rsync^)
            exit /b 0
          )
          set "ARGS=%*"
          set "ARGS=%ARGS:--copy-unsafe-links=%"
          "%~dp0gokr-rsync.exe" %ARGS%
          exit /b %ERRORLEVEL%
          CMD
          sed -i 's/^          //' "$RUNNER_TEMP/bin/rsync.cmd"
          cat "$RUNNER_TEMP/bin/rsync.cmd"
      - name: Install rsync 3.x for the remote side (MSYS2)
        run: |
          ls /c/msys64/usr/bin/pacman.exe
          /c/msys64/usr/bin/pacman.exe -S --noconfirm rsync 2>&1 | tail -3
          /c/msys64/usr/bin/rsync.exe --version | head -1
      - name: Create a key without passphrase
        run: ssh-keygen -q -t rsa -b 2048 -N '' -f "$RUNNER_TEMP/id_rsa" -C github-test-key
      - name: Prepare the sshd of the runner
        shell: pwsh
        run: |
          $key = "$env:RUNNER_TEMP\id_rsa"
          # the runner user is an administrator: the key goes to administrators_authorized_keys
          Copy-Item "$key.pub" C:\ProgramData\ssh\administrators_authorized_keys -Force
          icacls C:\ProgramData\ssh\administrators_authorized_keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"
          # remote commands run in the bash of MSYS2, which has rsync and the unix tools the tests use
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -Value C:\msys64\usr\bin\bash.exe -PropertyType String -Force
          [Environment]::SetEnvironmentVariable('Path', 'C:\msys64\usr\bin;' + [Environment]::GetEnvironmentVariable('Path','Machine'), 'Machine')
          Restart-Service sshd
          Get-Service sshd
          icacls $key /inheritance:r /grant:r "$($env:USERNAME):R" | Out-Null
          "TEST_USER=$env:USERNAME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TEST_USER2=$env:USERNAME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TEST_KEYFILE=$key" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Choose the ssh
        run: |
          if [ "${{ matrix.ssh }}" = win32-openssh ]; then
            echo "C:\\Windows\\System32\\OpenSSH" >> "$GITHUB_PATH"
          else
            echo "C:\\Program Files\\Git\\usr\\bin" >> "$GITHUB_PATH"
          fi
          echo "$RUNNER_TEMP\\bin" >> "$GITHUB_PATH"
      - name: Show the tools the tests will use
        shell: pwsh
        run: |
          Get-Command ssh, rsync | Format-Table Name, Source
          ssh -V
          rsync --version
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i $env:TEST_KEYFILE "$env:TEST_USER@localhost" 'echo remote-ok; uname -a; command -v rsync; rsync --version | head -1; echo $HOME; pwd'
          if ("${{ matrix.ssh }}" -eq "git-ssh") { $cm = "/tmp/cm-%C" } else { $cm = "$env:RUNNER_TEMP\cm-%C" }
          ssh -v -o ControlMaster=auto -o "ControlPath=$cm" -o ControlPersist=60 -o StrictHostKeyChecking=no -o BatchMode=yes -i $env:TEST_KEYFILE "$env:TEST_USER@localhost" true
          "ControlMaster exit code: $LASTEXITCODE"
        continue-on-error: true
      - name: gokr-rsync.exe alone (without scw, so without ControlMaster)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $key = $env:TEST_KEYFILE
          $env:RSYNC_RSH = "ssh -i $key -o StrictHostKeyChecking=no -o BatchMode=yes -o LogLevel=ERROR"
          $remote = "$($env:TEST_USER)@localhost"
          function Remote($cmd) { ssh -i $key -o StrictHostKeyChecking=no -o BatchMode=yes -o LogLevel=ERROR $remote $cmd }
          function Case($title, [scriptblock]$body) { "`n===== $title"; & $body; "exit code: $LASTEXITCODE" }
          $w = Join-Path $env:RUNNER_TEMP 'rs'; New-Item -ItemType Directory -Force $w | Out-Null; Set-Location $w
          New-Item -ItemType Directory -Force src\tree\sub, "src\dir with space" | Out-Null
          'one' | Set-Content src\a.txt; 'two' | Set-Content src\b.txt; 'x' | Set-Content src\tree\sub\c.txt; 'sp' | Set-Content "src\dir with space\s.txt"
          Remote 'rm -rf ~/r4w; mkdir -p ~/r4w'
          Case 'push: relative file' { gokr-rsync.exe src\a.txt "${remote}:r4w/p1/" ; Remote 'ls -R ~/r4w/p1' }
          Case 'push: forward-slash relative file' { gokr-rsync.exe src/b.txt "${remote}:r4w/p2/" ; Remote 'ls -R ~/r4w/p2' }
          Case 'push: absolute path with drive letter (C:\... style)' { gokr-rsync.exe "$w\src\a.txt" "${remote}:r4w/p3/" ; Remote 'ls -R ~/r4w/p3' }
          Case 'push: /c/... style absolute path' { $u = '/' + ($w.Substring(0,1).ToLower()) + $w.Substring(2).Replace('\','/'); gokr-rsync.exe "$u/src/a.txt" "${remote}:r4w/p4/" ; Remote 'ls -R ~/r4w/p4' }
          Case 'push: directory with trailing slash (contents)' { gokr-rsync.exe -r src/tree/ "${remote}:r4w/p5/" ; Remote 'ls -R ~/r4w/p5' }
          Case 'push: directory without trailing slash' { gokr-rsync.exe -r src/tree "${remote}:r4w/p6/" ; Remote 'ls -R ~/r4w/p6' }
          Case 'push: a directory whose name has a space (escaped for the remote)' { gokr-rsync.exe -r "src/dir with space" "${remote}:r4w/p7/" ; Remote 'ls -R ~/r4w/p7' }
          Case 'push: -a (archive)' { gokr-rsync.exe -a src/tree/ "${remote}:r4w/p8/" ; Remote 'ls -lR ~/r4w/p8' }
          Remote 'mkdir -p ~/r4w/pull/d; echo r1 > ~/r4w/pull/r1.txt; echo r2 > ~/r4w/pull/r2.txt; echo r3 > ~/r4w/pull/d/r3.txt'
          Case 'pull: file to a directory' { New-Item -ItemType Directory -Force dst1 | Out-Null; gokr-rsync.exe "${remote}:r4w/pull/r1.txt" dst1\ ; Get-ChildItem -Recurse dst1 | ForEach-Object FullName }
          Case 'pull: file with a drive-letter destination' { New-Item -ItemType Directory -Force dst2 | Out-Null; gokr-rsync.exe "${remote}:r4w/pull/r1.txt" "$w\dst2\" ; Get-ChildItem -Recurse dst2 | ForEach-Object FullName }
          Case 'pull: directory' { gokr-rsync.exe -r "${remote}:r4w/pull/d/" dst3/ ; Get-ChildItem -Recurse dst3 | ForEach-Object FullName }
          Case 'pull: two sources' { New-Item -ItemType Directory -Force dst4 | Out-Null; gokr-rsync.exe "${remote}:r4w/pull/r1.txt" "${remote}:r4w/pull/r2.txt" dst4/ ; Get-ChildItem dst4 | ForEach-Object Name }
          Case 'pull: missing source (rsync exits with 23)' { gokr-rsync.exe "${remote}:r4w/pull/none.txt" dst4/ }
          Case 'version' { gokr-rsync.exe --version }
      - name: Install dependencies
        run: npm ci
      - name: Start the ssh-agent service
        shell: pwsh
        run: |
          Get-Service ssh-agent | Format-List Name, Status, StartType
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          Get-Service ssh-agent | Format-List Name, Status, StartType
          ssh-add -l
          "ssh-add -l exit: $LASTEXITCODE"
      - name: Probe ensureAgentForHost
        timeout-minutes: 4
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DEBUG = "sshClientWrapper:debug:agent*,sshClientWrapper:debug:fork"
          node --input-type=module -e "
            import { ensureAgentForHost } from './lib/agent.js';
            const h = { host: 'localhost', user: process.env.TEST_USER, keyFile: process.env.TEST_KEYFILE };
            await ensureAgentForHost(h);
            console.log('RESULT', JSON.stringify({ managedAgentSock: h.managedAgentSock, ensuredAt: typeof h._agentEnsuredAt }));
            process.exit(0);
          " 2>&1
          ssh-add -l
          "ssh-add -l exit: $LASTEXITCODE"
      - name: Run the agent integration tests
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          (Get-Content test/integration/sshExec.js) -replace 'await send\(hostInfo, \[path.resolve\(__dirname, "../testUtil/testrc"\)\], rcfilePath, \[\], 0\);', '' | Set-Content test/integration/sshExec.js
          if ("${{ matrix.ssh }}" -eq "git-ssh") { $env:SSH_CONTROL_PERSIST_DIR = "/tmp" }
          npx mocha test/integration/sshExec.js --grep "ssh-agent" --reporter spec --timeout 40000 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\result.txt"
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "### windows, ssh = ${{ matrix.ssh }}, remote = sshd of the runner + MSYS2 rsync, gokrazy/rsync ${{ env.GOKRAZY_VERSION }}" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Select-String -Path "$env:RUNNER_TEMP\result.txt" -Pattern '^\s+\d+ (passing|failing|pending)' | ForEach-Object { $_.Line } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
